name: Deploy Pages

# Builds the Next.js static export and ships it to the `realty-royale`
# Cloudflare Pages project. Mirrors `deploy-worker.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          NEXT_PUBLIC_WORKER_ORIGIN: https://realty-royale-worker.christopher-s-chen.workers.dev
        run: bun run build

      - name: Deploy to Cloudflare Pages
        run: bun x wrangler pages deploy out --project-name=realty-royale --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

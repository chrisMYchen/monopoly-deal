name: Deploy Worker

# Pushes to `main` that touch the worker code (or its engine deps) auto-deploy
# the Cloudflare Worker that hosts the Room DurableObject. The Pages frontend
# is wired separately via Cloudflare Pages' built-in Git integration.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/engine/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck worker
        run: bun run typecheck:worker

      - name: Deploy worker to Cloudflare
        run: bun x wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

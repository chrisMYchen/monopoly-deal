name = "realty-royale-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Publish at <name>.<your-subdomain>.workers.dev. Without this Wrangler uploads
# the script but doesn't bind any trigger, leaving the worker unreachable.
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
